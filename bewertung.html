<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gründer-Elfen Bewertung</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --fg:#14202e; --muted:#4f5d6c; --line:#c9d2dc;
  --accent:#234bb0; --accent-fg:#ffffff; --ok:#1c7a46; --ok-bg:#e3f3ea; --err:#b3261e; --sel:#e6edff; --pad:#ffffff;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161e; --card:#18212c; --fg:#e8eef5; --muted:#a3b0bf; --line:#34424f;
  --accent:#7aa2ff; --accent-fg:#0b1220; --ok:#6fd49a; --ok-bg:#16301f; --err:#ff8a80; --sel:#1d2c4a; --pad:#ffffff; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:19px/1.45 var(--font);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.55rem;line-height:1.25;margin:0}
h2{font-size:1.15rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:14px 18px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:60px;width:100%;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:transparent;color:var(--accent)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.95rem;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top .back{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;padding:8px 4px;cursor:pointer;min-height:44px}
.top .back:disabled{visibility:hidden}
.prog{flex:1;display:flex;flex-direction:column;gap:4px}
.prog .t{font-size:.85rem;color:var(--muted);text-align:right}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{font-size:1.35rem;font-weight:700;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font:inherit;font-weight:600;text-align:left;cursor:pointer}
.opt .e{font-size:2rem;line-height:1;width:2.4rem;text-align:center}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--sel)}
.opt[aria-pressed=true]::after{content:"✓";margin-left:auto;color:var(--accent);font-size:1.4rem}
.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.grid10 .opt{justify-content:center;font-size:1.4rem;min-height:64px;padding:0}
.grid10 .opt[aria-pressed=true]::after{content:none}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
textarea,input[type=text]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
textarea{min-height:150px;resize:vertical}
#padbox{position:relative;width:100%;height:210px;border:2px solid var(--line);border-radius:12px;background:var(--pad);touch-action:none;overflow:hidden}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#padbox .line{position:absolute;left:8%;right:8%;bottom:48px;border-bottom:2px dashed #9aa6b4;pointer-events:none}
#padbox .x{position:absolute;left:5%;bottom:50px;color:#9aa6b4;font-size:1.3rem;pointer-events:none}
#padbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7d8896;pointer-events:none;font-size:1rem}
.msg{min-height:1.2em;font-size:.95rem}.msg.err{color:var(--err);font-weight:600}.msg.ok{color:var(--ok)}
.sum{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.sum div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sum b{text-align:right}
.big{font-size:3.2rem;text-align:center;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:6px}
.label{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.logo{height:46px;width:auto;align-self:flex-start}
@media (max-width:360px){body{font-size:17px}.grid10{gap:6px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head><body>

<!-- ===== Ungültiger Link ===== -->
<main id="vBad" hidden>
  <h1>Gründer-Elfen</h1>
  <p class="muted">Dieser Link ist unvollständig. Bitte öffnen Sie den Link, den Sie von Turabi Akünlü erhalten haben.</p>
</main>

<!-- ===== Link erstellen (für Turabi) ===== -->
<main id="vNew" hidden>
  <img class="logo" id="logoNew" alt="Gründer-Elfen">
  <h1>Bewertungs-Link erstellen</h1>
  <div class="card">
    <label class="fld"><span class="label">Name Teilnehmer</span><input type="text" id="nName" autocomplete="off" placeholder="z. B. Latife Demiroglu"></label>
    <label class="fld"><span class="label">Maßnahme</span><input type="text" id="nMass" autocomplete="off"></label>
    <label class="fld"><span class="label">Zeitraum (freiwillig)</span><input type="text" id="nZeit" autocomplete="off" placeholder="z. B. 01.09.2026 – 31.10.2026"></label>
    <button class="btn" id="nGo">Link erstellen</button>
    <div class="msg" id="nMsg"></div>
  </div>
  <div class="card" id="nOut" hidden>
    <h2 id="nOutT"></h2>
    <input type="text" id="nLink" readonly>
    <div class="row">
      <button class="btn sm" id="nCopy">Kopieren</button>
      <a class="btn sm" id="nWa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn sm sec" id="nMail">E-Mail</a>
      <a class="btn sm sec" id="nOpen" target="_blank" rel="noopener">Ansehen</a>
    </div>
    <p class="small muted">Die ausgefüllte Bewertung kommt als PDF in deine Liste „Unterschrieben“ im Unterschriften-Tool.</p>
  </div>
</main>

<!-- ===== Bewertung (für Teilnehmer) ===== -->
<main id="vRate" hidden>
  <div class="top" id="top" hidden>
    <button class="back" id="back">‹ Zurück</button>
    <div class="prog"><div class="t" id="progT"></div><div class="bar"><i id="progB"></i></div></div>
  </div>
  <div id="step"></div>
</main>

function slug(s){

}
function rid(){ const a = new Uint8Array(9); crypto.getRandomValues(a); return Array.from(a, b => (b % 36).toString(36)).join(""); }

const R = {info:null, i:-1, a:{}, key:"", sig:null, done:false};
function save(){ try{ localStorage.setItem(R.key, JSON.stringify({i:R.i, a:R.a, name:R.info.n})); }catch(e){} }
function load(){ try{ const j = JSON.parse(localStorage.getItem(R.key) || "null"); if(j && j.done) return j; if(j && j.a){ R.a = j.a; if(!R.info.n && j.name) R.info.n = j.name; return j; } }catch(e){} return null; }

function initRate(tok){
  const info = dec(tok);
  if(!info || typeof info !== "object"){ $("vBad").hidden = false; return; }
  R.info = {n: String(info.n || "").slice(0, 80), m: String(info.m || DEF_MASS).slice(0, 120), z: String(info.z || "").slice(0, 60)};
  R.key = "ge_bew_" + tok.slice(0, 60);
  $("vRate").hidden = false;
  const old = load();
  $("back").onclick = () => { if(R.i > -1) go(R.i - 1); };
  if(old && old.done){ R.done = true; showDone(true); return; }
  go(-1);
}
const TOTAL = QS.length + 1; // + Unterschrift
function go(i){
  R.i = i; save();
  const box = $("step"); box.textContent = "";
  $("top").hidden = i < 0;
  $("back").disabled = i < 0;
  const n = Math.min(i + 1, TOTAL);
  $("progT").textContent = i < QS.length ? "Frage " + n + " von " + QS.length : "Fast geschafft";
  $("progB").style.width = Math.round((i + 1) / (TOTAL) * 100) + "%";
  window.scrollTo({top: 0});
  if(i < 0) return stepStart(box);
  if(i >= QS.length) return stepSign(box);
  const q = QS[i];
  if(q.type === "scale") stepScale(box, q);
  else if(q.type === "ten") stepTen(box, q);
  else stepText(box, q);
}

  cv = $("pad"); ctx = cv.getContext("2d"); dirty = false;
  requestAnimationFrame(sizePad);
  cv.addEventListener("pointerdown", e => { e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} drawing = true; last = ppos(e);
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.6, 0, 7); ctx.fillStyle = "#0b1a4a"; ctx.fill(); dirty = true; $("ph").hidden = true; const m = $("sMsg"); if(m && m.classList.contains("err")){ m.textContent = ""; m.className = "msg"; } });
  cv.addEventListener("pointermove", e => { if(!drawing) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const ev of (evs.length ? evs : [e])){ const p = ppos(ev); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; } });
  const end = () => { drawing = false; };

}
const ppos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function sizePad(){
  if(!cv) return; const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1a4a"; ctx.lineWidth = 3;
  dirty = false; const ph = $("ph"); if(ph) ph.hidden = false;
}
window.addEventListener("resize", () => { if(cv && document.body.contains(cv) && !dirty) sizePad(); });
function clearPad(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore(); dirty = false; $("ph").hidden = false; }
function exportSig(){
  const w = cv.width, h = cv.height, d = ctx.getImageData(0,0,w,h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0, n = 0;
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){ if(d[(y*w+x)*4+3] > 10){ n++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1 < x0 || n < 60 || (x1 - x0) < 25) return null;
  const m = 8; x0 = Math.max(0,x0-m); y0 = Math.max(0,y0-m); x1 = Math.min(w-1,x1+m); y1 = Math.min(h-1,y1+m);
  const c = document.createElement("canvas"); c.width = x1-x0+1; c.height = y1-y0+1;
  c.getContext("2d").drawImage(cv, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return {png: b64ToBytes(c.toDataURL("image/png").split(",")[1]), ar: c.width / c.height};
}

/* ---------- PDF ---------- */
async function buildPdf(info, a, sig, when){
  const {PDFDocument, StandardFonts, rgb} = PDFLib;
  const OKCH = new Set("€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ");
  const san = s => String(s == null ? "" : s).replace(/[\r\t]+/g, " ").split("").map(ch => {
    const c = ch.charCodeAt(0); if(ch === "\n") return ch;
    if(c >= 32 && (c <= 255 || OKCH.has(ch))) return ch;
    const b = ch.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return (b && b.charCodeAt(0) >= 32 && b.charCodeAt(0) <= 255) ? b : "";
  }).join("");
  const pdf = await PDFDocument.create(), R_ = await pdf.embedFont(StandardFonts.Helvetica), B = await pdf.embedFont(StandardFonts.HelveticaBold);
  const BLACK = rgb(0,0,0), GREY = rgb(.35,.38,.42), LG = rgb(.85,.87,.9), BLUE = rgb(.04,.1,.29);
  const W = 595.28, H = 841.89, L = 50, Rr = W - 50;
  let pg = pdf.addPage([W, H]), y;
  const T = (s, x, yy, size, f, c) => pg.drawText(san(s), {x, y: yy, size, font: f || R_, color: c || BLACK});
  const wid = (s, size, f) => (f || R_).widthOfTextAtSize(san(s), size);
  function wrap(s, size, maxW, f){ const out = []; san(s).split("\n").forEach(par => { let cur = ""; par.split(" ").filter(Boolean).forEach(w => { const t = cur ? cur + " " + w : w; if(!cur || wid(t, size, f) <= maxW) cur = t; else { out.push(cur); cur = w; } }); out.push(cur); }); return out; }
  const box = (x, yy, s, on) => { pg.drawRectangle({x, y: yy, width: s, height: s, borderColor: BLACK, borderWidth: .8}); if(on){ pg.drawLine({start:{x:x+2,y:yy+2}, end:{x:x+s-2,y:yy+s-2}, thickness:1.4, color:BLUE}); pg.drawLine({start:{x:x+2,y:yy+s-2}, end:{x:x+s-2,y:yy+2}, thickness:1.4, color:BLUE}); } };

  // Kopf
  const logo = await pdf.embedPng(b64ToBytes(LOGO_B64)), lw = 92, lh = lw * logo.height / logo.width;
  pg.drawImage(logo, {x: Rr - lw, y: H - 34 - lh, width: lw, height: lh});
  y = H - 62;
  T("Bewertung der Maßnahme durch den Teilnehmer", L, y, 16, B); y -= 18;
  T("Kursbewertung (Zufriedenheit mit Maßnahme, Dozent, Lernumgebung und Weiterempfehlung)", L, y, 8.5, R_, GREY);
  y = Math.min(y, H - 34 - lh) - 26;
  const dateStr = when.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
  const meta = [["Name Kursteilnehmer:", info.n], ["Maßnahme:", info.m], ["Zeitraum:", info.z || "-"], ["Dozent / Coach:", COACH], ["Datum:", dateStr]];
  meta.forEach(([k, v]) => { T(k, L, y, 10, B); T(v, L + 120, y, 10); y -= 15; });
  y -= 10;

  // Skala-Tabelle
  const cols = ["sehr zufrieden", "zufrieden", "teils, teils", "unzufrieden", "sehr unzufrieden"], cw = 54, qx = L, tx = Rr - cols.length * cw;
  pg.drawRectangle({x: L, y: y - 26, width: Rr - L, height: 30, color: rgb(.94,.95,.97)});
  T("Bitte bewerten Sie", qx + 6, y - 14, 9.5, B);
  cols.forEach((c, i) => { const ls = wrap(c, 7.5, cw - 4); ls.forEach((ln, j) => T(ln, tx + i * cw + (cw - wid(ln, 7.5)) / 2, y - 9 - j * 9, 7.5, B)); });
  y -= 30;
  QS.filter(q => q.type === "scale").forEach((q, qi) => {
    const ls = wrap((qi + 1) + ". " + q.pdf, 9.5, tx - qx - 14), rh = Math.max(28, ls.length * 12 + 12);
    ls.forEach((ln, j) => T(ln, qx + 6, y - 16 - j * 12, 9.5));
    const v = a[q.k];
    [5,4,3,2,1].forEach((sv, i) => box(tx + i * cw + cw / 2 - 6, y - rh / 2 - 6, 12, v === sv));
    y -= rh; pg.drawLine({start:{x: L, y}, end:{x: Rr, y}, thickness: .5, color: LG});
  });
  y -= 22;

  // Weiterempfehlung 1-10
  T("6. Wie wahrscheinlich würden Sie uns weiterempfehlen?", L, y, 10.5, B); y -= 24;
  const gx = L + 70, gw = (Rr - L - 140) / 10;

  for(let v = 1; v <= 10; v++){ const cx = gx + (v - 0.5) * gw; T(String(v), cx - wid(String(v), 9) / 2, y + 10, 9); box(cx - 6, y - 8, 12, a.empf === v); }
  y -= 34;

  // Freitext
  function textBlock(title, txt){

    const ls = txt ? wrap(txt, 9.5, Rr - L - 16) : ["(keine Angabe)"];
    const h = Math.max(46, ls.length * 12.5 + 14);
    if(y - h < 170 && ls.length > 3){ pg = pdf.addPage([W, H]); y = H - 60; }
    pg.drawRectangle({x: L, y: y - h, width: Rr - L, height: h, borderColor: rgb(.6,.63,.67), borderWidth: .7});
    ls.forEach((ln, j) => T(ln, L + 8, y - 16 - j * 12.5, 9.5, R_, txt ? BLUE : GREY));
    y -= h + 20;
  }
  textBlock("7. Womit waren Sie besonders zufrieden?", a.gut);

  y -= sh + 4;
  pg.drawLine({start:{x: L, y}, end:{x: L + 170, y}, thickness: .7, color: BLACK});
  pg.drawLine({start:{x: L + 210, y}, end:{x: Rr, y}, thickness: .7, color: BLACK});
  T("Datum", L, y - 11, 8.5, R_, GREY); T("Unterschrift Teilnehmer/in (" + info.n + ")", L + 210, y - 11, 8.5, R_, GREY);

  // Fuß
  const pages = pdf.getPages();
  const foot = "Online ausgefüllt und unterschrieben am " + dateStr + " um " + when.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) + " Uhr · Gründer-Elfen, Turabi Akünlü, Kattenvennerstr. 6, 49219 Glandorf";
  pages.forEach((p, i) => { p.drawText(san(foot), {x: L, y: 30, size: 7, font: R_, color: GREY}); if(pages.length > 1) p.drawText((i + 1) + "/" + pages.length, {x: Rr - 14, y: 30, size: 7, font: R_, color: GREY}); });

  pdf.setTitle("Bewertung durch Teilnehmer " + san(info.n)); pdf.setAuthor("Gründer-Elfen"); pdf.setCreator("Gründer-Elfen Bewertungstool");
  pdf.setSubject("Bewertung " + san(info.m));
  // Maschinenlesbare Werte für die Auswertung der Qualitätsziele
  pdf.setKeywords(["bewertung-v1", "gesamt=" + a.gesamt, "coach=" + a.coach, "inhalte=" + a.inhalte, "orga=" + a.orga, "ergebnis=" + a.ergebnis, "empf=" + a.empf]);
  pdf.setCreationDate(when);
  return await pdf.save();
}

let OUT = null, FNAME = "";
async function submit(){
  const msg = $("sMsg"), btn = $("send");
  const sig = exportSig();
  if(!sig){ msg.textContent = "Bitte unterschreiben Sie zuerst im weißen Feld."; msg.className = "msg err"; return; }
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Wird gesendet …";
  try{
    const when = new Date();
    OUT = await buildPdf(R.info, R.a, sig, when);
    FNAME = "Bewertung_durch_Teilnehmer_" + R.info.n.replace(/[^A-Za-z0-9ÄÖÜäöüß-]+/g, "_") + ".pdf";
    const stamp = when.toISOString().replace(/[-:T]/g,"").slice(0,14);
    const path = "signiert/" + rid() + "__bewertung-" + slug(R.info.n) + "__" + stamp + ".pdf";
    let ok = false;
    for(let t = 0; t < 2 && !ok; t++){
      try{
        const r = await fetch(SB_URL + "/storage/v1/object/" + BUCKET + "/" + path, {method:"POST",
          headers: {apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type":"application/pdf"}, body: OUT});
        ok = r.ok;
      }catch(e){}
    }
    R.done = ok;
    if(ok){ try{ localStorage.setItem(R.key, JSON.stringify({done: true})); }catch(e){} }
    showDone(ok);
  }catch(e){ msg.textContent = "Fehler: " + (e.message || e); msg.className = "msg err"; btn.disabled = false; }
}
function showDone(ok){
  $("top").hidden = true;
  const box = $("step"); box.textContent = "";

  if(ok){
    c.append(el("div", {class:"big", text:"🎉"}), el("h1", {text:"Vielen Dank!"}),

    c.append(el("h1", {text:"Fast fertig"}),
      el("p", {text:"Die Übertragung hat leider nicht geklappt. Bitte tippen Sie unten und senden Sie die Datei per WhatsApp oder E-Mail an " + COACH + "."}),
      el("button", {class:"btn", on:{click: shareOut}}, "Bewertung senden / speichern"),

}
async function submitRetry(){ R.done = false; go(QS.length); }
async function shareOut(){
  if(!OUT) return;
  const file = new File([OUT], FNAME, {type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title: FNAME}); return; }catch(e){ if(e && e.name === "AbortError") return; } }
  const url = URL.createObjectURL(file), a = document.createElement("a"); a.href = url; a.download = FNAME; document.body.append(a); a.click(); a.remove();
}
